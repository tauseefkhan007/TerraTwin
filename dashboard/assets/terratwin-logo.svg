<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TerraTwin Earth, Moon and Mars mark</title>
  <desc id="desc">A blue Earth with a small grey Moon and red Mars on connected orbital paths.</desc>
  <defs>
    <radialGradient id="earth" cx="34%" cy="28%" r="72%">
      <stop offset="0" stop-color="#9af0ff"/>
      <stop offset=".48" stop-color="#277bb7"/>
      <stop offset="1" stop-color="#0b213d"/>
    </radialGradient>
    <radialGradient id="moon" cx="32%" cy="28%" r="72%">
      <stop offset="0" stop-color="#f4f7f8"/>
      <stop offset="1" stop-color="#73818d"/>
    </radialGradient>
    <radialGradient id="mars" cx="32%" cy="28%" r="72%">
      <stop offset="0" stop-color="#ffc28c"/>
      <stop offset="1" stop-color="#8b3d38"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#68d7ee" opacity=".5">
    <ellipse cx="256" cy="256" rx="194" ry="88" transform="rotate(-18 256 256)"/>
    <ellipse cx="256" cy="256" rx="218" ry="132" transform="rotate(28 256 256)" stroke="#f0a067" opacity=".35"/>
  </g>
  <circle cx="256" cy="256" r="104" fill="#68d7ee" opacity=".2" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="94" fill="url(#earth)" stroke="#a7efff" stroke-width="3"/>
  <path d="M206 208c22-22 48-28 66-17l-11 27 24 15-19 34-34-8-30 24-28-31zM278 285l34-13 28 26-19 36-39 4-18-25z" fill="#89c38f" opacity=".74"/>
  <circle cx="121" cy="190" r="24" fill="url(#moon)" stroke="#d7e5ec" stroke-width="2"/>
  <circle cx="427" cy="349" r="27" fill="url(#mars)" stroke="#ffc09a" stroke-width="2"/>
  <circle cx="111" cy="178" r="4" fill="#fff" opacity=".7"/>
  <circle cx="418" cy="338" r="4" fill="#5f292f" opacity=".7"/>
</svg>
